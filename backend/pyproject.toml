[project]
name = "aerofoil-tester-backend"
version = "0.1.0"
description = "The Python API for the Aerofoil Tester educational project."
requires-python = ">=3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "python-multipart>=0.0.20,<1",
  "uvicorn[standard]>=0.34,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aerofoil_tester"]

[project.optional-dependencies]
dev = [
  "basedpyright>=1.35,<2",
  "httpx2>=2,<3",
  "pytest>=9,<10",
  "ruff>=0.14,<1",
]

[tool.ruff]
line-length = 120
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.basedpyright]
pythonVersion = "3.14"
typeCheckingMode = "all"
reportMissingTypeStubs = "warning"

[tool.pytest.ini_options]
testpaths = ["src", "tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
filterwarnings = ["error"]
